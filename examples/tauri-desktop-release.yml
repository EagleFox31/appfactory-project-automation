name: Tauri desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    uses: EagleFox31/appfactory-project-automation/.github/workflows/release-tauri-desktop.yml@v1
    with:
      product-name: My-Tauri-Product
      working-directory: .
      node-version: "24"
      target-branch: main
      release-config-file: release-please-config.json
      release-manifest-file: .release-please-manifest.json
    secrets:
      release_token: ${{ secrets.APPFACTORY_RELEASE_TOKEN }}
