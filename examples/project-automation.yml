name: Project automation

on:
  issues:
    types: [opened, reopened, edited, closed]
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional issue number to resync. Leave empty to bootstrap/reconcile the Project."
        required: false
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  sync-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Sync GitHub Project
        uses: EagleFox31/appfactory-project-automation@v1
        with:
          token: ${{ secrets.PROJECT_TOKEN }}
          config-path: .github/project-config.json
          issue-number: ${{ inputs.issue_number }}
