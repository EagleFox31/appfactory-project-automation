name: Product release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_as:
        description: Optional one-time semantic version override for the first release, for example 0.1.0.
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    uses: EagleFox31/appfactory-project-automation/.github/workflows/reusable-release.yml@v1
    with:
      release-type: simple
      target-branch: main
      release-as: ${{ inputs.release_as }}
    secrets:
      release_token: ${{ secrets.APPFACTORY_RELEASE_TOKEN }}
