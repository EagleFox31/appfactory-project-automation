name: AppFactory Project Automation
description: Automate GitHub Projects, backlog management, issue metadata and pull request lifecycle with GitHub Actions.
author: EagleFox31

inputs:
  token:
    description: GitHub token with Projects v2 access and permission to create or update the configured Project when bootstrap is enabled.
    required: true

  governance-token:
    description: Optional dedicated credential used only when repository governance is enabled. Requires Administration write access to the consuming repository.
    required: false
    default: ""

  config-path:
    description: Path to the repository-specific project configuration JSON file.
    required: false
    default: .github/project-config.json

  issue-number:
    description: Optional issue number for workflow_dispatch resync. Leave empty to run Project bootstrap when enabled. Accepts 15, #15, or issue_number = 15.
    required: false
    default: ""

runs:
  using: node24
  main: src/index.mjs

branding:
  icon: grid
  color: blue
