name: AppFactory Project Automation
description: Automate GitHub Projects, backlog management, issue metadata and pull request lifecycle with GitHub Actions.
author: EagleFox31

inputs:
  token:
    description: GitHub token with Projects v2 access. Required for Project automation; unused by governance plan/apply runs.
    required: false
    default: ""

  project-authentication:
    description: Project credential source. Use token for the existing PAT flow or github-app-user for OIDC exchange through an AppFactory token broker.
    required: false
    default: token

  project-token-broker-url:
    description: HTTPS exchange endpoint for github-app-user authentication. The broker must validate the GitHub Actions OIDC identity before returning a short-lived GitHub App user token.
    required: false
    default: ""

  project-token-broker-audience:
    description: Audience requested in the GitHub Actions OIDC token and enforced by the token broker.
    required: false
    default: appfactory-project-automation

  governance-token:
    description: Optional dedicated credential used only when repository governance is enabled. Requires Administration write access to the consuming repository.
    required: false
    default: ""

  governance-administration-verified:
    description: Set to true only when the caller already proved Administration write while minting the governance credential. AppFactory reusable workflows set this for repository-scoped GitHub App tokens.
    required: false
    default: "false"

  governance-mode:
    description: Repository governance execution mode. Use off for normal Project automation, plan for a read-only preview, or apply to reconcile the AppFactory-managed ruleset.
    required: false
    default: "off"

  config-path:
    description: Path to the repository-specific project configuration JSON file.
    required: false
    default: .github/project-config.json

  issue-number:
    description: Optional issue number for workflow_dispatch resync. Leave empty to run Project bootstrap when enabled. Accepts 15, #15, or issue_number = 15.
    required: false
    default: ""

runs:
  using: node24
  main: src/index.mjs

branding:
  icon: grid
  color: blue
