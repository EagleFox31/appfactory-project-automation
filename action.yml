name: AppFactory Project Automation
description: Synchronize GitHub Issues and linked pull requests with a GitHub Projects v2 board.
author: EagleFox31

inputs:
  token:
    description: GitHub token with access to the target Projects v2 board.
    required: true
  config-path:
    description: Path to the repository-specific project configuration JSON file.
    required: false
    default: .github/project-config.json
  issue-number:
    description: Optional issue number for workflow_dispatch resync. Accepts 15, #15, or issue_number = 15.
    required: false
    default: ""

runs:
  using: node24
  main: src/index.mjs

branding:
  icon: grid
  color: blue
