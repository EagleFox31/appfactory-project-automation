name: AppFactory AWS Free Plan preflight - automatic and read only

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/auto-aws-free-plan-preflight.yml
      - infra/aws/appfactory-central-staging-iam-bootstrap.yml
      - src/deployment/aws-free-plan-gate.mjs
      - scripts/deployment/auto-aws-free-plan-preflight.mjs
      - scripts/deployment/inspect-precis-staging-iam-stack.mjs
      - scripts/deployment/inspect-precis-staging-iam-template.mjs
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: appfactory-aws-staging-readonly-preflight
  cancel-in-progress: false

jobs:
  inspect:
    name: Audit real AWS Free Plan without cloud writes
    if: github.repository == 'EagleFox31/appfactory-project-automation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EagleFox31/Pr-cis-Translation
          ref: 18618e5ca8b76a3a6b62278e16e0c6fd2fd078fd
          path: .precis
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify immutable and reviewed Précis template
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C .precis rev-parse HEAD)" == 18618e5ca8b76a3a6b62278e16e0c6fd2fd078fd ]] || exit 1
          node scripts/deployment/inspect-precis-staging-iam-template.mjs
      - name: Authenticate against Trigenys with reviewed GitHub OIDC role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::458018461157:role/appfactory-staging-iam-deployer
          aws-region: eu-west-3
          role-session-name: appfactory-readonly-free-tier
          role-duration-seconds: 900
      - name: Inspect independent AWS identity and Free Plan (read only)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          aws sts get-caller-identity --output json > "$RUNNER_TEMP/appfactory-auto-sts.json"
          aws freetier get-account-plan-state --region us-east-1 --output json > "$RUNNER_TEMP/appfactory-auto-freetier.json"
      - name: Validate credits, plan and account with fail-closed gates
        run: node scripts/deployment/auto-aws-free-plan-preflight.mjs
      - name: Verify Précis IAM template syntax in real AWS (read only)
        run: |
          aws cloudformation validate-template \
            --region eu-west-3 \
            --template-body file://.precis/deploy/infra/aws-free-plan-readonly-role.yml
      - name: Inspect exact existing approved CloudFormation change set metadata (read only)
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation describe-change-set \
            --region eu-west-3 \
            --stack-name precis-staging-iam-readonly \
            --change-set-name appfactory-precis-staging-38008163231 \
            --query '{StackName:StackName,ChangeSetName:ChangeSetName,RoleARN:RoleARN,Capabilities:Capabilities,Status:Status,ExecutionStatus:ExecutionStatus,ParameterKeys:Parameters[].ParameterKey}' \
            --output json
      - name: Inspect exact pending stack service-role association (read only)
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks \
            --region eu-west-3 \
            --stack-name precis-staging-iam-readonly \
            --query '{StackName:Stacks[0].StackName,StackStatus:Stacks[0].StackStatus,RoleARN:Stacks[0].RoleARN}' \
            --output json
      - name: Inspect actual Précis tenant IAM stack status (read only)
        run: node scripts/deployment/inspect-precis-staging-iam-stack.mjs
      - name: Clean up transient account inspection output
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/appfactory-auto-sts.json" "$RUNNER_TEMP/appfactory-auto-freetier.json"

# This workflow never invokes IAM/CloudFormation writes, EC2, SSM or provisioners.
# The GitHub staging environment may be auto-created on first use. An unprotected
# environment must not be considered approval for any separate IAM apply workflow.
