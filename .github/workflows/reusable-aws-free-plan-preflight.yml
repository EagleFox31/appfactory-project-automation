name: Reusable AWS staging Free Plan/credits preflight (read only)

on:
  workflow_call:
    inputs:
      appfactory_ref:
        required: true
        type: string
        description: Immutable, reviewed AppFactory commit SHA
      role_arn:
        required: true
        type: string
        description: Dedicated AWS OIDC role with STS and freetier:GetAccountPlanState only

permissions:
  contents: read
  id-token: write

jobs:
  free-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require manual dispatch from main with pinned dependency
        shell: bash
        env:
          PINNED_REF: ${{ inputs.appfactory_ref }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || {
            echo "::error::Only manual dispatch can request AWS staging preflight"
            exit 1
          }
          [[ "$GITHUB_REF" == refs/heads/main ]] || {
            echo "::error::Dispatch must be on the protected main branch"
            exit 1
          }
          [[ "$PINNED_REF" =~ ^[a-f0-9]{40}$ ]] || {
            echo "::error::AppFactory must be pinned to a full commit SHA"
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          repository: EagleFox31/appfactory-project-automation
          ref: ${{ inputs.appfactory_ref }}
          path: .appfactory
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assume narrowly scoped, read-only AWS OIDC role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: us-east-1
          role-session-name: appfactory-free-plan-preflight
          role-duration-seconds: 900
      - name: Fetch current account plan and independent AWS identity (read only)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          aws sts get-caller-identity --region us-east-1 --output json > "$RUNNER_TEMP/appfactory-sts-identity.json"
          aws freetier get-account-plan-state --region us-east-1 --output json > "$RUNNER_TEMP/appfactory-free-plan-state.json"
      - name: Gate staging on Free Plan status, credits and expiration
        run: node .appfactory/scripts/deployment/verify-aws-free-plan.mjs
      - name: Remove transient AWS snapshots
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/appfactory-sts-identity.json"
          rm -f "$RUNNER_TEMP/appfactory-free-plan-state.json"

# This workflow does NOT provision, deploy, send SSM commands or claim free EC2 usage.
# It requires an AWS role set up outside the repository with freetier:GetAccountPlanState.
