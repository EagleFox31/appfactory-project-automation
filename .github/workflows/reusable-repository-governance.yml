name: Reusable repository governance

on:
  workflow_call:
    inputs:
      governance_mode:
        description: Governance execution mode passed to the AppFactory Action.
        required: false
        type: string
        default: apply
      config_path:
        description: Path to the consumer repository governance configuration.
        required: false
        type: string
        default: .github/project-config.json
      appfactory_ref:
        description: AppFactory tag or immutable commit to execute. Keep v1 after release.
        required: false
        type: string
        default: v1
    secrets:
      governance_token:
        description: Dedicated credential with Administration write access to the consumer repository.
        required: true

permissions:
  contents: read

concurrency:
  group: repository-governance-${{ github.repository }}
  cancel-in-progress: false

jobs:
  govern:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Checkout AppFactory runtime
        uses: actions/checkout@v4
        with:
          repository: EagleFox31/appfactory-project-automation
          ref: ${{ inputs.appfactory_ref }}
          path: .appfactory
          persist-credentials: false

      - name: Reconcile repository governance
        uses: ./.appfactory
        with:
          governance-token: ${{ secrets.governance_token }}
          governance-mode: ${{ inputs.governance_mode }}
          config-path: ${{ inputs.config_path }}
