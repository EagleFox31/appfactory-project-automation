name: Reusable container plan (read-only)

on:
  workflow_call:
    inputs:
      config_path:
        description: Consumer Docker/Compose profile to validate
        type: string
        required: false
        default: .github/appfactory-deploy.json
      source_sha:
        description: Exact source commit SHA to inspect
        type: string
        required: true
      appfactory_ref:
        description: Immutable AppFactory code SHA
        type: string
        required: true
    outputs:
      source_sha:
        value: ${{ jobs.plan.outputs.source_sha }}
      plan_valid:
        value: ${{ jobs.plan.outputs.valid }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      valid: ${{ steps.result.outputs.valid }}
    steps:
      - name: Checkout exact consumer code without stored credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Checkout immutable AppFactory validator
        uses: actions/checkout@v4
        with:
          repository: EagleFox31/appfactory-project-automation
          ref: ${{ inputs.appfactory_ref }}
          path: .appfactory
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate configuration (no docker build, GHCR write or AWS)
        id: plan
        env:
          APPFACTORY_DEPLOY_CONFIG: ${{ inputs.config_path }}
          APPFACTORY_DEPLOY_MODE: plan
          APPFACTORY_SOURCE_SHA: ${{ inputs.source_sha }}
        run: node .appfactory/scripts/deployment/plan.mjs
      - name: Assert plan completed
        id: result
        run: echo "valid=true" >> "$GITHUB_OUTPUT"
